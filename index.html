<style>
:root{--bg:#0d1a1f;--card:#15262c;--tx:#ece7da;--mu:#9fb2b1;--au:#d4b483;--on:#14211f;--sh:0 8px 22px #0006;--fu:'Segoe UI',Tahoma,system-ui,sans-serif;--fr:Amiri,'Noto Naskh Arabic','Traditional Arabic',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#f3eee2;--card:#fffbf1;--tx:#22302f;--mu:#5b6b69;--au:#2f6f6a;--on:#ffffff;--sh:0 6px 16px #3a2f1a26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--fu);line-height:1.6}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:18px 16px 24px;max-width:760px;width:100%;margin:0 auto}
h1,h2,h3{font-family:var(--fr);margin:.2em 0}h1{font-size:32px}h2{color:var(--au);font-size:22px}
nav{display:flex;background:var(--card);border-top:1px solid #ffffff1a}
nav button{flex:1;min-height:52px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px}nav .on{color:var(--au);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.btn{background:var(--au);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;min-height:44px}.btn.g{background:none;color:var(--au);border:1px solid var(--au)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:6px;background:#ffffff22;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--au)}
input,textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid #ffffff2a;border-radius:10px;padding:11px;font:inherit;margin:6px 0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--au);color:var(--on);padding:9px 16px;border-radius:20px;z-index:99}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 6px}
.plank{height:14px;margin:0 -6px 24px;border-radius:3px;background:linear-gradient(#7a5632,#3d2915);box-shadow:0 12px 14px -6px #000b}
.bk{aspect-ratio:2/3;border-radius:3px 9px 9px 3px;padding:10px 12px 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden;color:#f3ead3;box-shadow:-5px 7px 10px #000a;transition:transform .25s,box-shadow .25s;user-select:none;-webkit-user-select:none;touch-action:pan-y;background:linear-gradient(160deg,var(--c1),var(--c2))}
.bk::before{content:'';position:absolute;top:0;bottom:0;right:0;width:9px;background:linear-gradient(90deg,#0005,#ffffff30)}
.p0::after,.p1::after,.p2::after,.p3::after{content:'';position:absolute;inset:0;pointer-events:none}
.p0::after{background:repeating-linear-gradient(135deg,#ffffff0d 0 6px,transparent 6px 14px)}.p1::after{background:radial-gradient(circle at 70% 25%,#d4b48355,transparent 45%)}
.p2::after{border:2px solid #d4b48366;inset:7px 16px 7px 7px;border-radius:3px}.p3::after{background:linear-gradient(#d4b48333 0 22%,transparent 22%)}
.bk b{font:700 14px/1.35 var(--fr);position:relative;z-index:1}.bk small{opacity:.75;font-size:11px;position:relative;z-index:1}
.bk:active{transform:translateY(-6px) rotate(-1.5deg)}.bk.lift{transition:none;z-index:9;box-shadow:0 24px 34px #000d}
.empty{text-align:center;padding:50px 10px}.empty h2{font-size:26px}
.hc{display:flex;flex-direction:column;gap:3px}.hc i{width:18px;height:18px;border-radius:4px;background:var(--au);display:block}.heat{display:flex;gap:3px;direction:ltr;overflow-x:auto}
.chip{display:inline-block;background:#d4b48322;border:1px solid #d4b48355;border-radius:20px;padding:3px 10px;margin:3px;font-size:13px}
.rd{position:fixed;inset:0;z-index:20;background:var(--pb);color:var(--pc)}
.rd[data-p=ivory]{--pb:#141d20;--pp:#f1e9d6;--pc:#2b2a22}.rd[data-p=white]{--pb:#1c2326;--pp:#fbfaf6;--pc:#1d2423}.rd[data-p=sepia]{--pb:#231f18;--pp:#e5d5b2;--pc:#3a2f1c}.rd[data-p=night]{--pb:#0a1014;--pp:#16222a;--pc:#d4d1c4}
.vp{position:absolute;inset:0;padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(64px + env(safe-area-inset-bottom,0px));perspective:1300px}
.pgw{height:100%;padding:22px 20px;background:var(--pp);color:var(--pc);border-radius:4px 14px 14px 4px;box-shadow:inset 16px 0 20px -16px #0007,0 10px 28px #000a}
.vp:not(.book) .pgw{box-shadow:none;border-radius:10px}
.tx{height:100%;font:var(--fs)/var(--lh) var(--fr);overflow:hidden;column-fill:auto}.tx.sc{overflow-y:auto}.tx h2{color:inherit;font-size:1.25em}.tx p{margin:0 0 .8em}
.pgw.f1{animation:f1 .45s ease}.pgw.f2{animation:f2 .45s ease}
@keyframes f1{from{transform:rotateY(-60deg);opacity:.3}to{transform:none;opacity:1}}@keyframes f2{from{transform:rotateY(60deg);opacity:.3}to{transform:none;opacity:1}}
.bar2{position:absolute;left:0;right:0;display:flex;gap:6px;align-items:center;padding:8px 10px;background:#000b;color:#efe9da;z-index:2;transition:opacity .25s}
.bar2.top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px))}.bar2.bot{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.bar2 button{flex:1;background:none;border:1px solid #d4b48366;color:#efe9da;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-height:44px}.bar2 .t,.bar2 #pi{flex:1;text-align:center;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fz .bar2{opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;background:var(--card);color:var(--tx);border-radius:20px 20px 0 0;padding:16px;z-index:30;box-shadow:0 -10px 30px #000b}
@media(prefers-reduced-motion:reduce){.pgw.f1,.pgw.f2{animation:none}.bk{transition:none}}
</style>

<style>
body{background:radial-gradient(900px 520px at 85% -8%,#1b3a41 0,transparent 62%),radial-gradient(700px 400px at 0% 100%,#2a1d33 0,transparent 60%),var(--bg)}
:root[data-t=light] body{background:radial-gradient(900px 500px at 85% -8%,#dfe9e3 0,transparent 60%),var(--bg)}
.card{border:1px solid #ffffff12;background:linear-gradient(180deg,#ffffff0a,transparent 60%),var(--card)}
.btn{background:linear-gradient(180deg,#e3c898,var(--au));box-shadow:0 4px 12px #0004}:root[data-t=light] .btn{background:linear-gradient(180deg,#3b8680,var(--au))}.btn.g{background:none;box-shadow:none}
nav{margin:0 10px 8px;border-radius:20px;border:1px solid #ffffff14;overflow:hidden}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}nav .on{background:#d4b48318}
.hero2{position:relative;overflow:hidden;border-radius:22px;padding:22px 16px 56px;color:#ece7da;background:linear-gradient(135deg,#1d4249,#0f1f26 58%,#2a1d33);box-shadow:0 14px 34px #0008;border:1px solid #ffffff18}
.hero2 .kick{margin:0;font-size:12px;letter-spacing:2px;color:#d4b483}.hero2 h1{font-size:60px;line-height:1.1;margin:0;color:#d4b483;text-shadow:0 4px 18px #d4b48344}.hero2 .sub{margin:4px 0 0;color:#c4cdcb;font-size:14px}
.stats{display:flex;gap:8px;margin-top:16px}.stats div{flex:1;background:#00000045;border:1px solid #ffffff18;border-radius:14px;padding:8px 4px;text-align:center}.stats b{display:block;font-size:22px;color:#d4b483}.stats span{font-size:11px;color:#a9b8b6}
.spines{position:absolute;left:0;right:0;bottom:0;height:36px;background:repeating-linear-gradient(90deg,#5a3a52 0 14px,#2f4f6b 14px 30px,#4a5a3a 30px 42px,#6b4a3a 42px 58px,#3a5a54 58px 70px);opacity:.5;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sec h2{margin:0;font-size:20px}.sec h2::before{content:'\25C6  ';font-size:10px;opacity:.7}
.pill{background:var(--au);color:var(--on);border-radius:20px;padding:2px 12px;font-weight:700;font-size:13px}
.qr{display:flex;gap:10px;align-items:center;padding:8px 0}.ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;font-size:14px}.ck.ok{background:var(--au);border-color:var(--au);color:var(--on)}
.hrs{display:flex;gap:2px;align-items:flex-end;height:70px;direction:ltr}.hrs i{flex:1;background:#ffffff26;border-radius:3px 3px 0 0}.hrs i.pk{background:var(--au)}.hl{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--mu)}
.vbs{display:flex;gap:8px;height:120px;align-items:flex-end}.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mu)}.vb i{width:100%;background:var(--au);border-radius:5px 5px 0 0;min-height:3px}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bd div{border:1px solid #ffffff1a;border-radius:12px;padding:10px;font-size:13px;opacity:.45}.bd div.on{opacity:1;border-color:var(--au);background:#d4b48316}
.feat2{display:flex;gap:14px;align-items:center}.thumb{width:84px;aspect-ratio:2/3;flex:none;border-radius:3px 8px 8px 3px;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:8px 10px 6px 6px;color:#f3ead3;box-shadow:-4px 6px 10px #0009;font:700 11px/1.3 var(--fr)}
.row3{padding:16px 8px 0;background:linear-gradient(#0a1417,#11222a);border-radius:10px 10px 0 0;box-shadow:inset 0 0 26px #000a}
.plank{background:repeating-linear-gradient(90deg,#7a5632 0 40px,#6b4a2b 40px 78px);border-top:2px solid #9a7448}
</style>

<script>
const K='athar.v1',day=()=>new Date().toISOString().slice(0,10),$=id=>document.getElementById(id),M=$('m');
const DEF={fs:21,lh:2,t:'dark',mode:'book',paper:'ivory',warm:0};
let S={prog:{},pos:{},done:{},fav:{},order:[],notes:[],marks:[],log:{},set:{...DEF},cur:null},B=[];
try{const j=JSON.parse(localStorage.getItem(K)||'{}');S=Object.assign(S,j);S.set=Object.assign({},DEF,j.set||{})}catch(e){}
document.documentElement.dataset.t=S.set.t;
function sv(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('تعذّر الحفظ: التخزين ممتلئ أو معطّل');return false}}
function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),2300)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
const COV=[["#1f4a52","#0c2227"],["#3a3f6b","#161933"],["#5a3a52","#2a1726"],["#4a5a3a","#1f2a17"],["#6b4a3a","#2f1f17"],["#2f4f6b","#122233"],["#5b4a2f","#2a2113"],["#3a5a54","#162826"]];
const mins=()=>Math.floor((S.log[day()]||0)/60);
function week(){let s=0;for(let i=0;i<7;i++)s+=S.log[new Date(Date.now()-i*864e5).toISOString().slice(0,10)]||0;return Math.floor(s/60)}
function ordered(){const o=S.order;return [...B].sort((a,b)=>{const x=o.indexOf(a.id),y=o.indexOf(b.id);return (x<0?1e9:x)-(y<0?1e9:y)})}
function pct(b){if(S.done[b.id])return 100;if(S.prog[b.id]===undefined)return 0;return Math.round(((S.prog[b.id]||0)+(S.pos[b.id]||0))/b.ch.length*100)}
function eta(b){b.w=b.w||b.ch.map(c=>c[1].split(/\s+/).length);const ci=S.prog[b.id]||0;let r=b.w[ci]*(1-(S.pos[b.id]||0));for(let i=ci+1;i<b.w.length;i++)r+=b.w[i];return Math.max(1,Math.round(r/180))}
/* ---------- tabs ---------- */
let tab='home';
function nav(){$('nv').innerHTML=[['home','الرئيسية'],['lib','رفوفي'],['nb','دفتر الأثر'],['st','تطوري'],['se','الإعدادات']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(k){tab=k;draw()}function draw(){nav();({home,lib,nb,st,se})[tab]()}
function emptyBox(){return`<div class="empty"><h2>رفّك فاضي، وده أحلى بداية</h2><p class="mu">أضف كتبك أنت: EPUB أو PDF أو TXT أو MD.</p><button class="btn" onclick="$('imp').click()">+ إضافة أول كتاب</button></div>`}
function home(){const b=B.find(x=>x.id===S.cur)||ordered()[0],p=Math.min(100,Math.round(mins()/30*100)),q=S.notes.length?S.notes[Math.abs(hs(day()))%S.notes.length]:null;
M.innerHTML=`<h1 style="color:var(--au);font-size:42px;margin:0">أثَر</h1><p class="mu">اقرأ أقل بعشوائية. تعلّم بعمق. عِش بشكل أفضل.</p>
<input type="file" id="imp" accept=".epub,.pdf,.txt,.md" hidden onchange="imp(this.files[0])">
${b?`<div class="card"><span class="mu">${S.cur===b.id?'أكمل رحلتك':'ابدأ من هنا'}</span><h2>${esc(b.t)}</h2><div class="bar"><i style="width:${pct(b)}%"></i></div><p class="mu">${pct(b)}% · متبقي نحو ${eta(b)} دقيقة (تقدير)</p><button class="btn" onclick="openR('${b.id}')">تابع القراءة</button></div>`:`<div class="card">${emptyBox()}</div>`}
<div class="card"><div class="row" style="justify-content:space-between"><b>هدف اليوم</b><span>${mins()} / 30 دقيقة</span></div><div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div><p class="mu">هذا الأسبوع: ${week()} دقيقة</p></div>
${q?`<div class="card"><span class="mu">من دفترك، للتذكّر</span><p style="font-family:var(--fr);font-size:19px">${esc(q.x.slice(0,220))}</p></div>`:''}`}
/* ---------- shelves + drag ---------- */
function bookEl(b){const h=hs(b.id);return`<div class="bk p${Math.abs(h>>3)%4}" style="--c1:${COV[Math.abs(h)%COV.length][0]};--c2:${COV[Math.abs(h)%COV.length][1]}" data-id="${b.id}" onpointerdown="bd(event,'${b.id}')"><b>${esc(b.t)}</b><small>${esc(b.a||'')}</small><div class="bar"><i style="width:${pct(b)}%"></i></div>${ro?`<div class="row" style="gap:4px;position:relative;z-index:3"><button class="btn g" style="padding:4px 6px;min-height:34px;font-size:11px" onpointerdown="event.stopPropagation()" onclick="mvB('${b.id}',-1)">تقديم</button><button class="btn g" style="padding:4px 6px;min-height:34px;font-size:11px" onpointerdown="event.stopPropagation()" onclick="mvB('${b.id}',1)">تأخير</button></div>`:''}</div>`}
function lib(q=''){const n=norm(q),F=b=>ft==='all'||(ft==='now'&&S.prog[b.id]!==undefined&&!S.done[b.id])||(ft==='done'&&S.done[b.id])||(ft==='fav'&&S.fav[b.id]),L=ordered().filter(b=>F(b)&&(!n||norm(b.t+' '+(b.a||'')).includes(n)||(b.nl=b.nl||b.ch.map(c=>norm(c[0]+' '+c[1]))).some(t=>t.includes(n))));
let h=`<div class="row" style="justify-content:space-between"><h1>رفوفي</h1><button class="btn" onclick="$('imp').click()">+ إضافة كتاب</button></div><input type="file" id="imp" accept=".epub,.pdf,.txt,.md" hidden onchange="imp(this.files[0])"><input id="q" placeholder="ابحث في العناوين والمؤلفين ونصوص كتبك" value="${esc(q)}" oninput="lib(this.value)"><div class="row">${[['all','الكل'],['now','أقرأ الآن'],['done','مكتمل'],['fav','المفضلة']].map(([k,l])=>`<button class="btn ${ft===k?'':'g'}" style="min-height:36px;padding:6px 12px" onclick="ft='${k}';lib($('q').value)">${l}</button>`).join('')}</div><div class="row"><p class="mu" style="flex:1;margin:0">اضغط مطوّلًا على كتاب واسحبه فوق آخر لإعادة الترتيب.</p><button class="btn g" onclick="ro=!ro;lib($('q').value)">${ro?'إنهاء الترتيب':'ترتيب بالأزرار'}</button></div>`;
if(!B.length)h+=emptyBox();else if(!L.length)h+='<p class="mu">لا نتائج.</p>';else for(let i=0;i<L.length;i+=3)h+=`<div class="row3">${L.slice(i,i+3).map(bookEl).join('')}</div><div class="plank"></div>`;
M.innerHTML=h;if(q){const e=$('q');e.focus();e.setSelectionRange(q.length,q.length)}}
let ro=false,ft='all';
function mvB(id,d){const o=ordered().map(x=>x.id),i=o.indexOf(id),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S.order=o;sv();lib($('q')?$('q').value:'')}
let dg=null,tm=null,p0=null,mv=false,pid=null;
function bd(e,id){p0=[e.clientX,e.clientY];mv=false;pid=id;const el=e.currentTarget;tm=setTimeout(()=>{dg={id,el};el.classList.add('lift');navigator.vibrate&&navigator.vibrate(12)},350)}
document.addEventListener('pointermove',e=>{if(!p0)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1];if(!dg){if(Math.abs(dx)+Math.abs(dy)>10){mv=true;clearTimeout(tm)}return}dg.el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`});
document.addEventListener('touchmove',e=>{if(dg)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',e=>{if(!p0)return;clearTimeout(tm);const d=dg;
if(d){d.el.style.display='none';const t=document.elementFromPoint(e.clientX,e.clientY);d.el.style.display='';const tb=t&&t.closest&&t.closest('.bk');if(tb&&tb.dataset.id!==d.id){const o=ordered().map(x=>x.id).filter(x=>x!==d.id);o.splice(o.indexOf(tb.dataset.id),0,d.id);S.order=o;sv()}dg=null;lib()}
else if(!mv&&pid&&!ro)bookPage(pid);p0=null;pid=null});
document.addEventListener('pointercancel',()=>{clearTimeout(tm);if(dg){dg.el.classList.remove('lift');dg.el.style.transform=''}dg=null;p0=null});
function bookPage(id){const b=B.find(x=>x.id===id);if(!b)return;const nn=S.notes.filter(o=>o.b===id).length,mk=S.marks.filter(m=>m.b===id).length,w=b.ch.reduce((a,c)=>a+c[1].split(/\s+/).length,0),started=S.prog[id]!==undefined;
M.innerHTML=`<button class="btn g" onclick="lib()">رجوع للرف</button><div class="card"><h1>${esc(b.t)}</h1><p class="mu">${esc(b.a||'مؤلف غير محدد')} · ${esc(b.src||'')}</p><div class="bar"><i style="width:${pct(b)}%"></i></div><p>${pct(b)}% · ${b.ch.length} فصل · ${w} كلمة · ≈${eta(b)} دقيقة متبقية</p><p class="mu">${nn} ملاحظة · ${mk} علامة · الحالة: ${S.done[id]?'مكتمل':started?'أقرأه الآن':'لم أبدأ'}</p>
<div class="row"><button class="btn" onclick="openR('${id}')">${started?'تابع القراءة':'ابدأ القراءة'}</button><button class="btn g" onclick="S.fav[id]=!S.fav[id];sv();bookPage('${id}')">${S.fav[id]?'★ في المفضلة':'☆ للمفضلة'}</button><button class="btn g" onclick="dna('${id}')">بصمة الكلمات</button></div><div id="dn-${id}"></div></div>
<div class="card"><b>الفصول</b>${b.ch.map((c,i)=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff14" onclick="S.prog['${id}']=${i};S.pos['${id}']=0;openR('${id}')">${i+1}. ${esc(c[0])}</div>`).join('')}</div>`;M.scrollTop=0}
/* ---------- reader ---------- */
let R=null,t0=null,step=0,pages=1,pg=0;
const flt=()=>`sepia(${S.set.warm}%) brightness(${100-S.set.warm/3}%)`;
